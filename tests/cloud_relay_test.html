<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CueSport Cloud Relay Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; max-width: 720px; }
    .pass { color: #9ece6a; }
    .fail { color: #f7768e; }
    .skip { color: #e0af68; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    code { background: #1a1b26; padding: 2px 6px; border-radius: 4px; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>CueSport Cloud Relay Tests</h1>
  <p>
    Backend: <code id="serverUrl">http://localhost:3000</code>
    (override with <code>?server=http://localhost:4003</code>)
  </p>
  <button id="runBtn">Run all tests</button>
  <p id="summary"></p>
  <ul id="results"></ul>
  <script src="../common/js/cloud_relay.js"></script>
  <script>
    const SERVER = new URLSearchParams(location.search).get('server') || 'http://localhost:3000';
    document.getElementById('serverUrl').textContent = SERVER;

    function log(msg, status) {
      const li = document.createElement('li');
      li.className = status;
      li.textContent = (status === 'pass' ? 'PASS: ' : status === 'skip' ? 'SKIP: ' : 'FAIL: ') + msg;
      document.getElementById('results').appendChild(li);
      return status === 'pass';
    }

    async function fetchJson(path, options) {
      const res = await fetch(SERVER + path, options);
      const body = await res.json().catch(() => ({}));
      return { ok: res.ok, body };
    }

    function wsJoin(payload) {
      const wsUrl = SERVER.replace(/^http/, 'ws') + '/ws';
      return new Promise((resolve, reject) => {
        const ws = new WebSocket(wsUrl);
        const t = setTimeout(() => { ws.close(); reject(new Error('timeout')); }, 8000);
        ws.onopen = () => ws.send(JSON.stringify({ type: 'join', ...payload }));
        ws.onmessage = (ev) => {
          const data = JSON.parse(ev.data);
          if (data.type === 'joined') {
            clearTimeout(t);
            resolve({ ws, data });
          } else if (data.type === 'error') {
            clearTimeout(t);
            ws.close();
            const err = new Error(data.message || data.code);
            err.code = data.code;
            reject(err);
          }
        };
        ws.onerror = () => { clearTimeout(t); reject(new Error('ws error')); };
      });
    }

    function waitForWsMessage(ws, predicate, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('message timeout')), timeoutMs);
        const onMessage = (ev) => {
          let data;
          try { data = JSON.parse(ev.data); } catch { return; }
          if (!predicate(data)) return;
          clearTimeout(t);
          ws.removeEventListener('message', onMessage);
          resolve(data);
        };
        ws.addEventListener('message', onMessage);
      });
    }

    async function runTests() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').textContent = '';
      let passed = 0, failed = 0, skipped = 0;
      function assert(name, cond, detail) {
        if (cond) { passed++; log(name, 'pass'); }
        else { failed++; log(name + (detail ? ' (' + detail + ')' : ''), 'fail'); }
      }
      function skip(name, reason) {
        skipped++;
        log(name + (reason ? ' — ' + reason : ''), 'skip');
      }

      // Backend unreachable → skip API tests
      const health = await fetch(SERVER + '/health').then(r => r.json()).catch(() => null);
      if (!health?.ok) {
        skip('Backend tests', 'Start backend: cd backend && npm start');
        assert('cloudRelay global exists', typeof window.cloudRelay === 'object');
        document.getElementById('summary').textContent = `${passed} passed, ${failed} failed, ${skipped} skipped (backend offline)`;
        return;
      }

      assert('Health endpoint', health.ok === true);

      assert('Dashboard CSS', (await fetch(SERVER + '/web/shared/styles.css')).ok);
      assert('Dashboard app.js', (await fetch(SERVER + '/web/dashboard/app.js')).ok);
      assert('Mobile guest page', (await fetch(SERVER + '/web/mobile/index.html')).ok);

      const secret = new URLSearchParams(location.search).get('dev_secret')
        || window.prompt('Dev auth secret (DEV_AUTH_SECRET from server .env):', '');
      if (!secret) throw new Error('Dev auth secret required (pass ?dev_secret=…)');
      const login = await fetchJson('/api/auth/dev-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret }),
      });
      assert('Dev login', login.ok && login.body.access_token?.startsWith('dev:'));
      // Rooms are created on first dock join (seat model), not at login.
      assert('Dev login room optional', login.body.room == null || !!login.body.room?.id);

      const token = login.body.access_token;

      let apiKey = null;
      const keyRes = await fetchJson('/api/api-keys', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: 'browser-test' }),
      });
      if (keyRes.ok && keyRes.body.key?.length === 32) {
        apiKey = keyRes.body.key;
        assert('Create API key', true);
      } else if (keyRes.body?.code === 'api_key_limit') {
        // Reuse an existing dock key when the starter seat quota is full.
        const me = await fetchJson('/api/me', {
          headers: { Authorization: 'Bearer ' + token },
        });
        const existingId = me.body?.api_keys?.[0]?.id;
        const viewed = existingId
          ? await fetchJson('/api/api-keys/' + existingId, {
              headers: { Authorization: 'Bearer ' + token },
            })
          : { ok: false, body: {} };
        apiKey = viewed.body?.key || null;
        assert('Create API key', !!apiKey && apiKey.length === 32, keyRes.body?.message || 'reuse existing key');
      } else {
        assert('Create API key', false, keyRes.body?.message || keyRes.body?.error || 'create failed');
      }

      let dockJoin;
      let roomId = null;
      if (!apiKey) {
        assert('WS join dock creates room', false, 'no API key available');
      } else {
        try {
          dockJoin = await wsJoin({
            client: 'dock',
            api_key: apiKey,
            instance_id: 'browser-relay-' + Date.now(),
          });
          roomId = dockJoin.data.room_id;
          assert('WS join dock creates room', !!roomId);
        } catch (e) {
          assert('WS join dock creates room', false, e.message);
        }
      }

      let mobileJoin;
      if (roomId) {
        try {
          mobileJoin = await wsJoin({ room_id: roomId, client: 'mobile', access_token: token });
          assert('WS join mobile (dev token)', mobileJoin.data.room_id === roomId);
          mobileJoin.ws.close();
        } catch (e) {
          assert('WS join mobile (dev token)', false, e.message);
        }
      } else {
        assert('WS join mobile (dev token)', false, 'no room from dock join');
      }

      if (dockJoin && roomId) {
        try {
          const mobile2 = await wsJoin({ room_id: roomId, client: 'mobile', access_token: token });
          const cmdPromise = waitForWsMessage(mobile2.ws, (d) => d.type === 'command');
          dockJoin.ws.send(JSON.stringify({
            type: 'command', room_id: roomId, action: 'score_add',
            payload: { player: '1' }, source: 'dock',
          }));
          const cmd = await cmdPromise;
          assert('Command relay', cmd.action === 'score_add');
          mobile2.ws.close();
        } catch (e) {
          assert('Command relay', false, e.message);
        }

        // Guest links: setup allowlist + single active session
        const guestLink = await fetchJson('/api/rooms/' + encodeURIComponent(roomId) + '/guest-link', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: 'browser-guest' }),
        });
        assert('Create guest link', guestLink.ok && !!guestLink.body.token);
        const guestToken = guestLink.body.token;

        let guestWs;
        if (guestToken) {
          try {
            guestWs = await wsJoin({ guest_token: guestToken, client: 'mobile_guest' });
            assert('WS join guest', guestWs.data.client === 'mobile_guest');
          } catch (e) {
            assert('WS join guest', false, e.message);
          }

          if (guestWs) {
            let secondBlocked = false;
            try {
              await wsJoin({ guest_token: guestToken, client: 'mobile_guest' });
            } catch (e) {
              secondBlocked = e.code === 'guest_link_in_use';
              assert('Guest second join rejected', secondBlocked, e.message);
            }
            if (!secondBlocked) {
              assert('Guest second join rejected', false, 'expected guest_link_in_use');
            }

            try {
              const setupCmdP = waitForWsMessage(dockJoin.ws, (d) => d.type === 'command' && d.action === 'set_game_type');
              guestWs.ws.send(JSON.stringify({
                type: 'command', action: 'set_game_type', payload: { gameType: 'game8' },
              }));
              const setupCmd = await setupCmdP;
              assert('Guest set_game_type allowed', setupCmd.action === 'set_game_type');
            } catch (e) {
              assert('Guest set_game_type allowed', false, e.message);
            }

            try {
              const goldCmdP = waitForWsMessage(dockJoin.ws, (d) => d.type === 'command' && d.action === 'set_snooker_gold');
              guestWs.ws.send(JSON.stringify({
                type: 'command', action: 'set_snooker_gold', payload: { enabled: true },
              }));
              const goldCmd = await goldCmdP;
              assert('Guest set_snooker_gold allowed', goldCmd.action === 'set_snooker_gold');
            } catch (e) {
              assert('Guest set_snooker_gold allowed', false, e.message);
            }

            try {
              const resetCmdP = waitForWsMessage(dockJoin.ws, (d) => d.type === 'command' && d.action === 'reset_scores');
              guestWs.ws.send(JSON.stringify({
                type: 'command', action: 'reset_scores', payload: {},
              }));
              const resetCmd = await resetCmdP;
              assert('Guest reset_scores allowed', resetCmd.action === 'reset_scores');
            } catch (e) {
              assert('Guest reset_scores allowed', false, e.message);
            }

            try {
              const callCmdP = waitForWsMessage(dockJoin.ws, (d) => d.type === 'command' && d.action === 'call_match_early');
              guestWs.ws.send(JSON.stringify({
                type: 'command', action: 'call_match_early', payload: {},
              }));
              const callCmd = await callCmdP;
              assert('Guest call_match_early allowed', callCmd.action === 'call_match_early');
            } catch (e) {
              assert('Guest call_match_early allowed', false, e.message);
            }

            try {
              const forbidP = waitForWsMessage(guestWs.ws, (d) => d.type === 'error' && d.code === 'guest_forbidden');
              guestWs.ws.send(JSON.stringify({
                type: 'command', action: 'set_player_name', payload: { slot: '1', name: 'Nope' },
              }));
              const forbid = await forbidP;
              assert('Guest set_player_name forbidden', forbid.code === 'guest_forbidden');
            } catch (e) {
              assert('Guest set_player_name forbidden', false, e.message);
            }

            guestWs.ws.close();
            await new Promise((r) => setTimeout(r, 150));
            try {
              const guest2 = await wsJoin({ guest_token: guestToken, client: 'mobile_guest' });
              assert('Guest reconnect after close', guest2.data.client === 'mobile_guest');
              guest2.ws.close();
            } catch (e) {
              assert('Guest reconnect after close', false, e.message);
            }
          }
        }

        try { dockJoin.ws.close(); } catch (_) { /* ignore */ }
      }

      assert('cloudRelay global', typeof window.cloudRelay === 'object');
      assert('cloudRelay.hasCredentials', typeof window.cloudRelay.hasCredentials === 'function');
      assert('cloudRelay.sendSession', typeof window.cloudRelay.sendSession === 'function');

      window.cloudRelay.setCredentials({ serverUrl: SERVER, roomId: 'test-room', apiKey: 'abc' });
      assert('hasCredentials when configured', window.cloudRelay.hasCredentials() === true);

      document.getElementById('summary').textContent =
        passed + ' / ' + (passed + failed) + ' passed' + (skipped ? ', ' + skipped + ' skipped' : '');
      document.getElementById('summary').className = failed ? 'fail' : 'pass';
    }

    document.getElementById('runBtn').onclick = () => runTests().catch(e => log(e.message, 'fail'));
  </script>
</body>
</html>
