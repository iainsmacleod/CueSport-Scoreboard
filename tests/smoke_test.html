<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CueSport Scoreboard — Smoke Tests</title>
    <style>
        :root {
            color-scheme: dark;
            --pass: #3d9a5c;
            --fail: #c44;
            --bg: #1a1d24;
            --panel: #252830;
            --text: #e8e8e8;
            --muted: #9aa0aa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Segoe UI, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.45;
        }
        h1 { margin: 0 0 8px; font-size: 1.4rem; }
        .intro { color: var(--muted); margin-bottom: 16px; max-width: 720px; }
        .intro code { background: var(--panel); padding: 2px 6px; border-radius: 3px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        button {
            cursor: pointer;
            border: 2px solid #000;
            background: #3a7;
            color: #111;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 0 0 8px 0;
        }
        button:disabled { opacity: 0.5; cursor: wait; }
        button.secondary { background: #556; color: #fff; }
        #summary {
            padding: 12px 14px;
            background: var(--panel);
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 16px;
            max-width: 720px;
        }
        #summary.pass { border-color: var(--pass); }
        #summary.fail { border-color: var(--fail); }
        table {
            width: 100%;
            max-width: 960px;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #2b2e38; }
        tr.pass td:first-child { color: var(--pass); font-weight: bold; }
        tr.fail td:first-child { color: var(--fail); font-weight: bold; }
        .suite { color: var(--muted); font-size: 0.82em; }
        .detail { color: var(--muted); font-family: Consolas, monospace; font-size: 0.85em; word-break: break-word; }
        iframe { display: none; }
    </style>
</head>
<body>
    <h1>CueSport Scoreboard — Smoke Tests</h1>
    <p class="intro">
        Run from a local HTTP server (IndexedDB and iframes need it). From the repo root:
        <code>python -m http.server 8765</code> then open
        <code>http://localhost:8765/tests/smoke_test.html</code>
    </p>
    <div class="toolbar">
        <button type="button" id="runBtn">Run all tests</button>
        <button type="button" id="reloadBtn" class="secondary">Reload frames</button>
        <span id="status" class="intro" style="margin:0"></span>
    </div>
    <div id="summary">Ready.</div>
    <table>
        <thead>
            <tr>
                <th style="width:72px">Result</th>
                <th style="width:140px">Suite</th>
                <th>Test</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <iframe id="cpFrame" title="control panel" src="../control_panel.html"></iframe>
    <iframe id="bsFrame" title="browser source" src="../browser_source.html"></iframe>

    <script>
    'use strict';

    const cpFrame = document.getElementById('cpFrame');
    const bsFrame = document.getElementById('bsFrame');
    const runBtn = document.getElementById('runBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const summaryEl = document.getElementById('summary');
    const resultsBody = document.getElementById('resultsBody');
    const statusEl = document.getElementById('status');

    function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function frameLoaded(frame) {
        return new Promise(function (resolve) {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
                return;
            }
            frame.addEventListener('load', function () { resolve(); }, { once: true });
        });
    }

    function overlayHidden(win) {
        const panel = win.document.getElementById('overlayStatsPanel');
        if (!panel) {
            return false;
        }
        return win.getComputedStyle(panel).display === 'none' ||
            panel.classList.contains('noShow');
    }

    async function reloadBSFrame() {
        bsFrame.src = '../browser_source.html?_=' + Date.now();
        await frameLoaded(bsFrame);
        await sleep(400);
        return getBS();
    }

    async function reloadFrames() {
        statusEl.textContent = 'Loading frames…';
        cpFrame.src = '../control_panel.html?_=' + Date.now();
        bsFrame.src = '../browser_source.html?_=' + Date.now();
        await Promise.all([frameLoaded(cpFrame), frameLoaded(bsFrame)]);
        await sleep(400);
        statusEl.textContent = 'Frames loaded.';
    }

    async function getCP() {
        const cp = cpFrame.contentWindow;
        for (let i = 0; i < 80; i++) {
            if (cp && cp.PlayerStats) {
                await cp.PlayerStats.init().catch(function () {});
                await sleep(200);
                return cp;
            }
            await sleep(100);
        }
        throw new Error('Control panel / PlayerStats not ready');
    }

    async function getBS() {
        const bs = bsFrame.contentWindow;
        for (let i = 0; i < 50; i++) {
            if (bs && typeof bs.restoreOverlayStatsFromStorage === 'function') {
                return bs;
            }
            await sleep(100);
        }
        throw new Error('Browser source not ready');
    }

    function renderResults(rows) {
        resultsBody.innerHTML = rows.map(function (r) {
            return '<tr class="' + (r.pass ? 'pass' : 'fail') + '">' +
                '<td>' + (r.pass ? 'PASS' : 'FAIL') + '</td>' +
                '<td class="suite">' + escapeHtml(r.suite) + '</td>' +
                '<td>' + escapeHtml(r.name) + '</td>' +
                '<td class="detail">' + escapeHtml(r.detail || '') + '</td></tr>';
        }).join('');

        const passed = rows.filter(function (r) { return r.pass; }).length;
        const total = rows.length;
        summaryEl.className = passed === total ? 'pass' : 'fail';
        summaryEl.textContent = passed + ' / ' + total + ' passed' +
            (passed === total ? ' — all good.' : ' — see failures below.');
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    async function runAllTests() {
        runBtn.disabled = true;
        reloadBtn.disabled = true;
        statusEl.textContent = 'Running…';
        const rows = [];
        const assert = function (suite, name, cond, detail) {
            rows.push({ suite: suite, name: name, pass: !!cond, detail: detail || '' });
        };

        let cp;
        let bs;
        let testPlayerId = null;
        let testOpponentId = null;
        const tag = 'Smoke_' + Date.now().toString().slice(-6);

        try {
            cp = await getCP();
            bs = await getBS();

            // --- Core ---
            assert('Core', 'PlayerStats loaded', !!cp.PlayerStats);
            assert('Core', 'Version 6.1.0', cp.versionNum === '6.1.0', cp.versionNum);
            assert('Core', 'Stats modal present', !!cp.document.getElementById('statsModal'));
            assert('Core', 'Overlay panel in browser source', !!bs.document.getElementById('overlayStatsPanel'));

            // --- Overlay ---
            cp.localStorage.removeItem('overlayStatsMode');
            cp.localStorage.setItem('h2hOverlayEnabled', 'yes');
            cp.PlayerStats.syncOverlayButtonsFromStorage();
            assert('Overlay', 'Legacy h2h flag does not enable mode',
                (cp.localStorage.getItem('overlayStatsMode') || '') === '');
            assert('Overlay', 'Legacy h2h flag cleared',
                cp.localStorage.getItem('h2hOverlayEnabled') === null);

            const h2hBtn = cp.document.getElementById('overlayH2HBtn');
            cp.toggleOverlayStats('h2h');
            assert('Overlay', 'H2H toggle on', cp.localStorage.getItem('overlayStatsMode') === 'h2h');
            cp.toggleOverlayStats('h2h');
            await sleep(150);
            const offPayload = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Overlay', 'H2H toggle off', (cp.localStorage.getItem('overlayStatsMode') || '') === '');
            assert('Overlay', 'Payload hidden when off', offPayload.visible === false);
            assert('Overlay', 'No overlay button active after off',
                h2hBtn && !h2hBtn.classList.contains('active'));

            bs = await reloadBSFrame();
            bs.localStorage.removeItem('overlayStatsMode');
            bs.localStorage.removeItem('overlayStatsPayload');
            bs.localStorage.setItem('overlayStatsPayload', JSON.stringify({
                visible: true, mode: 'h2h', p1Name: 'A', p2Name: 'B', p1Games: 1, p2Games: 0
            }));
            bs.restoreOverlayStatsFromStorage();
            await sleep(150);
            assert('Overlay', 'Browser source hides stale payload without mode', overlayHidden(bs));

            bs.localStorage.setItem('overlayStatsMode', 'h2h');
            bs.restoreOverlayStatsFromStorage();
            await sleep(150);
            assert('Overlay', 'Browser source restores with mode + payload', !overlayHidden(bs));
            bs.localStorage.removeItem('overlayStatsMode');
            bs.localStorage.setItem('overlayStatsPayload', JSON.stringify({ visible: false }));
            bs.restoreOverlayStatsFromStorage();

            // --- PlayerStats API ---
            const player = await cp.PlayerStats.ensurePlayer(tag + '_P1');
            testPlayerId = player.id;
            assert('PlayerStats API', 'Create player', player && player.name === (tag + '_P1').substring(0, 20));
            const found = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_p1').toLowerCase());
            assert('PlayerStats API', 'Find by normalized name', found && found.id === player.id);
            await cp.PlayerStats.updatePlayerName(player.id, tag + '_Renamed');
            const renamed = await cp.PlayerStats.getPlayer(player.id);
            assert('PlayerStats API', 'Rename player', renamed.name.indexOf('Renamed') !== -1);

            const searchHits = await cp.PlayerStats.searchPlayers(tag, 5);
            assert('PlayerStats API', 'Search players', searchHits.some(function (p) { return p.id === player.id; }),
                searchHits.length + ' hit(s)');

            const opp = await cp.PlayerStats.ensurePlayer(tag + '_P2');
            testOpponentId = opp.id;
            await cp.PlayerStats.saveMatch({
                player1Id: player.id,
                player2Id: opp.id,
                player1Name: renamed.name,
                player2Name: opp.name,
                gameType: 'game2',
                scoreP1: 5,
                scoreP2: 2,
                status: 'completed',
                date: new Date().toISOString().slice(0, 10),
                ballsP1: 0,
                ballsP2: 0
            });
            const h2h = await cp.PlayerStats.getHeadToHead(player.id, opp.id);
            const gamesTotal = (h2h.gamesWon[player.id] || 0) + (h2h.gamesWon[opp.id] || 0);
            assert('PlayerStats API', 'H2H after manual match', gamesTotal >= 1);

            const exp = await cp.PlayerStats.exportData();
            assert('PlayerStats API', 'Export schemaVersion', exp.schemaVersion >= 1);
            assert('PlayerStats API', 'Export players array', Array.isArray(exp.players));

            // --- Scoring ---
            if (typeof cp.resetScores === 'function') {
                try { cp.resetScores(); } catch (e) { /* confirm dialog blocked in iframe */ }
            }
            cp.document.getElementById('p1Name').value = tag + '_Live1';
            cp.document.getElementById('p2Name').value = tag + '_Live2';
            cp.document.getElementById('p1Name').removeAttribute('data-player-id');
            cp.document.getElementById('p2Name').removeAttribute('data-player-id');
            cp.document.getElementById('raceInfoTxt').value = 'Race to 5';
            cp.postNames();
            await sleep(400);

            const scoreBefore = parseInt(cp.getStorageItem('p1ScoreCtrlPanel') || '0', 10);
            cp.postScore('add', '1');
            await sleep(300);
            const scoreAfter = parseInt(cp.getStorageItem('p1ScoreCtrlPanel') || '0', 10);
            assert('Scoring', 'Rack increment', scoreAfter === scoreBefore + 1, scoreBefore + ' → ' + scoreAfter);

            cp.setStorageItem('p1BallsCtrlPanel', 0);
            cp.setStorageItem('p1Balls', 0);
            const p1BallsInput = cp.document.getElementById('p1Balls');
            if (p1BallsInput) { p1BallsInput.value = '0'; }
            cp.postBalls('sub', '1');
            const foulVal = parseInt(cp.getStorageItem('p1BallsCtrlPanel'), 10);
            assert('Scoring', 'Negative ball (foul)', foulVal === -1, String(foulVal));
            cp.postBalls('add', '1');
            assert('Scoring', 'Recover from foul', parseInt(cp.getStorageItem('p1BallsCtrlPanel'), 10) === 0);

            if (bs.handlers && bs.handlers.balls) {
                bs.handlers.balls({ player: '1', balls: -3 });
                const ballsEl = bs.document.getElementById('player1Balls');
                assert('Scoring', 'Overlay displays negative balls',
                    (ballsEl.textContent || ballsEl.innerHTML) === '-3');
            }

            cp.localStorage.setItem('overlayStatsMode', 'p1');
            cp.localStorage.setItem('overlayStatsPayload', '{"visible":true}');
            if (typeof cp.removeInstanceData === 'function') {
                cp.removeInstanceData(null);
            }
            assert('Scoring', 'Overlay mode survives data clear',
                cp.localStorage.getItem('overlayStatsMode') === 'p1');
            cp.localStorage.removeItem('overlayStatsMode');
            cp.localStorage.removeItem('overlayStatsPayload');

            // --- Stats modal UI ---
            cp.openStatsModal();
            await sleep(250);
            const modal = cp.document.getElementById('statsModal');
            const modalOpen = modal && cp.getComputedStyle(modal).display !== 'none';
            assert('Stats UI', 'Modal opens', modalOpen);
            assert('Stats UI', 'Leaderboard tab visible',
                !cp.document.getElementById('statsTab-leaderboard').classList.contains('noShow'));
            cp.switchStatsTab('h2h');
            await sleep(50);
            const h2hTab = cp.document.getElementById('statsTab-h2h');
            assert('Stats UI', 'H2H tab switches', h2hTab && !h2hTab.classList.contains('noShow'));
            const hiddenRect = cp.document.getElementById('statsTab-leaderboard').getBoundingClientRect();
            assert('Stats UI', 'Hidden tab takes no space', hiddenRect.height === 0);

            cp.switchStatsTab('detail');
            await sleep(200);
            const lbRows = cp.document.querySelectorAll('#statsLeaderboardBody tr.stats-row');
            if (lbRows.length) {
                cp.switchStatsTab('leaderboard');
                await sleep(100);
                lbRows[0].click();
                cp.switchStatsTab('detail');
                await sleep(200);
                const editBtn = cp.document.querySelector('#statsPlayerDetail .stats-edit-btn');
                if (editBtn) {
                    const st = cp.getComputedStyle(editBtn);
                    assert('Stats UI', 'Edit button align-items center', st.alignItems === 'center', st.alignItems);
                } else {
                    assert('Stats UI', 'Edit Name button present', false, 'no edit button');
                }
            }
            cp.closeStatsModal();

            const dataCol = Array.from(cp.document.querySelectorAll('.column')).find(function (c) {
                return c.textContent.indexOf('Clear Instance Data') !== -1;
            });
            const hint = Array.from(cp.document.querySelectorAll('p.stats-hint')).find(function (p) {
                return p.textContent.indexOf('does not effect player statistics') !== -1;
            });
            assert('Stats UI', 'Clear buttons row', dataCol && dataCol.children.length === 2);
            assert('Stats UI', 'Clear-data hint on separate line', hint && dataCol && !dataCol.contains(hint));

            // --- Ball stats visibility & labels ---
            const prevGameType = cp.getStorageItem('gameType') || 'game1';
            const prevPointBased = cp.getStorageItem('pointBased') || 'no';
            const boardHeaders = Array.from(cp.document.querySelectorAll('#statsTab-leaderboard th'))
                .map(function (th) { return th.textContent.trim(); });
            assert('Ball Stats', 'Board header Games W/L', boardHeaders.indexOf('Games W/L') !== -1, boardHeaders.join('|'));
            assert('Ball Stats', 'Board header Racks W/L', boardHeaders.indexOf('Racks W/L') !== -1, boardHeaders.join('|'));
            assert('Ball Stats', 'Board has no Balls Potted column', boardHeaders.indexOf('Balls Potted') === -1);

            cp.document.getElementById('gameType').value = 'game1';
            cp.gameType('game1');
            await sleep(150);
            assert('Ball Stats', '8-Ball is not dual score', cp.isDualScoreMode() === false);

            const bankPlayer = await cp.PlayerStats.ensurePlayer(tag + '_BallA');
            const bankOpp = await cp.PlayerStats.ensurePlayer(tag + '_BallB');
            await cp.PlayerStats.saveMatch({
                player1Id: bankPlayer.id,
                player2Id: bankOpp.id,
                gameType: 'game5',
                scoreP1: 2,
                scoreP2: 1,
                status: 'completed',
                date: new Date().toISOString().slice(0, 10),
                ballsP1: 9,
                ballsP2: 4
            });

            cp.document.getElementById('p1Name').value = bankPlayer.name;
            cp.document.getElementById('p2Name').value = bankOpp.name;
            cp.document.getElementById('p1Name').setAttribute('data-player-id', bankPlayer.id);
            cp.document.getElementById('p2Name').setAttribute('data-player-id', bankOpp.id);

            cp.localStorage.setItem('overlayStatsMode', 'p1');
            let overlayPayload = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Ball Stats', 'P1 overlay hides balls in 8-Ball', overlayPayload.showBalls !== true,
                JSON.stringify({ showBalls: overlayPayload.showBalls, ballsPotted: overlayPayload.ballsPotted }));

            cp.document.getElementById('gameType').value = 'game5';
            cp.gameType('game5');
            await sleep(200);
            assert('Ball Stats', 'Bank is dual score', cp.isDualScoreMode() === true);
            overlayPayload = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Ball Stats', 'P1 overlay shows balls in Bank', overlayPayload.showBalls === true);
            assert('Ball Stats', 'P1 overlay Balls Potted is a total',
                typeof overlayPayload.ballsPotted === 'number' && overlayPayload.ballsWL === undefined,
                String(overlayPayload.ballsPotted));
            assert('Ball Stats', 'P1 overlay Balls Potted value',
                overlayPayload.ballsPotted >= 9, String(overlayPayload.ballsPotted));

            cp.localStorage.setItem('overlayStatsMode', 'h2h');
            const h2hPayload = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Ball Stats', 'H2H overlay shows balls in Bank', h2hPayload.showBalls === true);
            assert('Ball Stats', 'H2H overlay has per-player totals',
                typeof h2hPayload.p1Balls === 'number' && typeof h2hPayload.p2Balls === 'number');

            cp.openStatsModal();
            await sleep(200);
            const ballRow = Array.from(cp.document.querySelectorAll('#statsLeaderboardBody tr.stats-row'))
                .find(function (row) { return row.dataset.playerId === bankPlayer.id; });
            if (ballRow) {
                ballRow.click();
                await sleep(250);
            }
            const detailHeaders = Array.from(cp.document.querySelectorAll('#statsTab-detail .stats-player-stats-table th'))
                .map(function (th) { return th.textContent.trim(); });
            assert('Ball Stats', 'Player detail has Balls Potted', detailHeaders.indexOf('Balls Potted') !== -1, detailHeaders.join('|'));
            assert('Ball Stats', 'Player detail Games W/L label', detailHeaders.indexOf('Games W/L') !== -1);
            assert('Ball Stats', 'Player detail Racks W/L label', detailHeaders.indexOf('Racks W/L') !== -1);
            const overallCells = Array.from(cp.document.querySelectorAll('#statsTab-detail .stats-overall-row td'))
                .map(function (td) { return td.textContent.trim(); });
            assert('Ball Stats', 'Player detail Balls Potted is numeric total',
                overallCells.length >= 4 && /^\d+$/.test(overallCells[3]), overallCells.join('|'));
            cp.closeStatsModal();

            cp.document.getElementById('statsMatchGameType').value = 'game1';
            cp.updateMatchBallFieldsVisibility();
            assert('Ball Stats', 'Match form hides balls for 8-Ball',
                cp.document.getElementById('statsMatchBallsRow').classList.contains('noShow'));
            cp.document.getElementById('statsMatchGameType').value = 'game5';
            cp.updateMatchBallFieldsVisibility();
            assert('Ball Stats', 'Match form shows balls for Bank',
                !cp.document.getElementById('statsMatchBallsRow').classList.contains('noShow'));

            bs.applyOverlayStats({
                visible: true,
                mode: 'p1',
                title: 'Smoke',
                showBalls: true,
                gamesWL: '1/0',
                racksWL: '2/1',
                winRate: 100,
                ballsPotted: 9,
                winStreak: 1
            });
            await sleep(50);
            const overlayText = (bs.document.getElementById('overlayStatsBody').innerText || '');
            assert('Ball Stats', 'Browser source labels Games W/L',
                overlayText.indexOf('Games W/L: 1/0') !== -1, overlayText.replace(/\n/g, ' | '));
            assert('Ball Stats', 'Browser source labels Rack W/L',
                overlayText.indexOf('Rack W/L: 2/1') !== -1, overlayText.replace(/\n/g, ' | '));
            assert('Ball Stats', 'Browser source labels Balls Potted',
                overlayText.indexOf('Balls Potted: 9') !== -1, overlayText.replace(/\n/g, ' | '));
            assert('Ball Stats', 'Browser source omits bare Balls label',
                !/(^|\n)Balls:/.test(overlayText), overlayText.replace(/\n/g, ' | '));
            assert('Ball Stats', 'Browser source omits bare Games/Racks labels',
                overlayText.indexOf('Games:') === -1 && overlayText.indexOf('Racks:') === -1,
                overlayText.replace(/\n/g, ' | '));

            cp.document.getElementById('gameType').value = 'game7';
            cp.gameType('game7');
            const pointBased = cp.document.getElementById('pointBased');
            if (pointBased) {
                pointBased.checked = false;
                cp.pointBasedSetting();
                await sleep(100);
                assert('Ball Stats', 'Custom without Point Based hides balls', cp.isDualScoreMode() === false);
                pointBased.checked = true;
                cp.pointBasedSetting();
                await sleep(100);
                assert('Ball Stats', 'Custom with Point Based shows balls', cp.isDualScoreMode() === true);
                pointBased.checked = prevPointBased === 'yes';
                cp.pointBasedSetting();
            }

            cp.document.getElementById('gameType').value = prevGameType;
            cp.gameType(prevGameType);
            cp.localStorage.removeItem('overlayStatsMode');
            cp.localStorage.removeItem('overlayStatsPayload');
            bs.applyOverlayStats({ visible: false });

            try { await cp.PlayerStats.deletePlayer(bankPlayer.id); } catch (e) { /* ignore */ }
            try { await cp.PlayerStats.deletePlayer(bankOpp.id); } catch (e) { /* ignore */ }

        } catch (err) {
            assert('Runner', 'Test harness', false, err.message || String(err));
        } finally {
            if (cp && testPlayerId) {
                try { await cp.PlayerStats.deletePlayer(testPlayerId); } catch (e) { /* ignore */ }
            }
            if (cp && testOpponentId) {
                try { await cp.PlayerStats.deletePlayer(testOpponentId); } catch (e) { /* ignore */ }
            }
            if (cp) {
                try {
                    const live1 = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_live1').toLowerCase());
                    const live2 = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_live2').toLowerCase());
                    if (live1) { await cp.PlayerStats.deletePlayer(live1.id); }
                    if (live2) { await cp.PlayerStats.deletePlayer(live2.id); }
                } catch (e) { /* ignore */ }
            }
        }

        renderResults(rows);
        statusEl.textContent = 'Done.';
        runBtn.disabled = false;
        reloadBtn.disabled = false;
    }

    window.runAllTests = runAllTests;

    runBtn.addEventListener('click', function () {
        runAllTests().catch(function (err) {
            summaryEl.className = 'fail';
            summaryEl.textContent = 'Runner error: ' + err.message;
            runBtn.disabled = false;
            reloadBtn.disabled = false;
        });
    });

    reloadBtn.addEventListener('click', function () {
        reloadFrames().catch(function (err) {
            statusEl.textContent = 'Reload failed: ' + err.message;
        });
    });

    reloadFrames().then(function () {
        statusEl.textContent = 'Frames ready — click Run all tests.';
    }).catch(function (err) {
        statusEl.textContent = 'Frame load failed: ' + err.message;
    });
    </script>
</body>
</html>
