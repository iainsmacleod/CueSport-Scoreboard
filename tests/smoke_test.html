<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CueSport Scoreboard — Smoke Tests</title>
    <style>
        :root {
            color-scheme: dark;
            --pass: #3d9a5c;
            --fail: #c44;
            --bg: #1a1d24;
            --panel: #252830;
            --text: #e8e8e8;
            --muted: #9aa0aa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Segoe UI, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.45;
        }
        h1 { margin: 0 0 8px; font-size: 1.4rem; }
        .intro { color: var(--muted); margin-bottom: 16px; max-width: 720px; }
        .intro code { background: var(--panel); padding: 2px 6px; border-radius: 3px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
        button {
            cursor: pointer;
            border: 2px solid #000;
            background: #3a7;
            color: #111;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 0 0 8px 0;
        }
        button:disabled { opacity: 0.5; cursor: wait; }
        button.secondary { background: #556; color: #fff; }
        #summary {
            padding: 12px 14px;
            background: var(--panel);
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 16px;
            max-width: 720px;
        }
        #summary.pass { border-color: var(--pass); }
        #summary.fail { border-color: var(--fail); }
        table {
            width: 100%;
            max-width: 960px;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 10px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #2b2e38; }
        tr.pass td:first-child { color: var(--pass); font-weight: bold; }
        tr.fail td:first-child { color: var(--fail); font-weight: bold; }
        .suite { color: var(--muted); font-size: 0.82em; }
        .detail { color: var(--muted); font-family: Consolas, monospace; font-size: 0.85em; word-break: break-word; }
        iframe { display: none; }
    </style>
</head>
<body>
    <h1>CueSport Scoreboard — Smoke Tests</h1>
    <p class="intro">
        Run from a local HTTP server (IndexedDB and iframes need it). From the repo root:
        <code>python -m http.server 8765</code> then open
        <code>http://localhost:8765/tests/smoke_test.html</code>
    </p>
    <div class="toolbar">
        <button type="button" id="runBtn">Run all tests</button>
        <button type="button" id="reloadBtn" class="secondary">Reload frames</button>
        <span id="status" class="intro" style="margin:0"></span>
    </div>
    <div id="summary">Ready.</div>
    <table>
        <thead>
            <tr>
                <th style="width:72px">Result</th>
                <th style="width:140px">Suite</th>
                <th>Test</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <iframe id="cpFrame" title="control panel" src="../control_panel.html"></iframe>
    <iframe id="bsFrame" title="browser source" src="../browser_source.html"></iframe>

    <script>
    'use strict';

    const cpFrame = document.getElementById('cpFrame');
    const bsFrame = document.getElementById('bsFrame');
    const runBtn = document.getElementById('runBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const summaryEl = document.getElementById('summary');
    const resultsBody = document.getElementById('resultsBody');
    const statusEl = document.getElementById('status');

    function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function frameLoaded(frame) {
        return new Promise(function (resolve) {
            if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
                resolve();
                return;
            }
            frame.addEventListener('load', function () { resolve(); }, { once: true });
        });
    }

    function overlayHidden(win) {
        const panel = win.document.getElementById('overlayStatsPanel');
        if (!panel) {
            return false;
        }
        return win.getComputedStyle(panel).display === 'none' ||
            panel.classList.contains('noShow');
    }

    async function reloadBSFrame() {
        bsFrame.src = '../browser_source.html?_=' + Date.now();
        await frameLoaded(bsFrame);
        await sleep(400);
        return getBS();
    }

    async function reloadFrames() {
        statusEl.textContent = 'Loading frames…';
        cpFrame.src = '../control_panel.html?_=' + Date.now();
        bsFrame.src = '../browser_source.html?_=' + Date.now();
        await Promise.all([frameLoaded(cpFrame), frameLoaded(bsFrame)]);
        await sleep(400);
        statusEl.textContent = 'Frames loaded.';
    }

    async function getCP() {
        const cp = cpFrame.contentWindow;
        for (let i = 0; i < 80; i++) {
            if (cp && cp.PlayerStats) {
                await cp.PlayerStats.init().catch(function () {});
                await sleep(200);
                return cp;
            }
            await sleep(100);
        }
        throw new Error('Control panel / PlayerStats not ready');
    }

    async function getBS() {
        const bs = bsFrame.contentWindow;
        for (let i = 0; i < 50; i++) {
            if (bs && typeof bs.restoreOverlayStatsFromStorage === 'function') {
                return bs;
            }
            await sleep(100);
        }
        throw new Error('Browser source not ready');
    }

    function renderResults(rows) {
        resultsBody.innerHTML = rows.map(function (r) {
            return '<tr class="' + (r.pass ? 'pass' : 'fail') + '">' +
                '<td>' + (r.pass ? 'PASS' : 'FAIL') + '</td>' +
                '<td class="suite">' + escapeHtml(r.suite) + '</td>' +
                '<td>' + escapeHtml(r.name) + '</td>' +
                '<td class="detail">' + escapeHtml(r.detail || '') + '</td></tr>';
        }).join('');

        const passed = rows.filter(function (r) { return r.pass; }).length;
        const total = rows.length;
        summaryEl.className = passed === total ? 'pass' : 'fail';
        summaryEl.textContent = passed + ' / ' + total + ' passed' +
            (passed === total ? ' — all good.' : ' — see failures below.');
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    async function runAllTests() {
        runBtn.disabled = true;
        reloadBtn.disabled = true;
        statusEl.textContent = 'Running…';
        const rows = [];
        const assert = function (suite, name, cond, detail) {
            rows.push({ suite: suite, name: name, pass: !!cond, detail: detail || '' });
        };

        let cp;
        let bs;
        let testPlayerId = null;
        let testOpponentId = null;
        const tag = 'Smoke_' + Date.now().toString().slice(-6);

        try {
            cp = await getCP();
            bs = await getBS();

            // --- Core ---
            assert('Core', 'PlayerStats loaded', !!cp.PlayerStats);
            assert('Core', 'Version 7.1.2', cp.versionNum === '7.1.2', cp.versionNum);
            assert('Core', 'Stats modal present', !!cp.document.getElementById('statsModal'));
            assert('Core', 'Overlay panel in browser source', !!bs.document.getElementById('overlayStatsPanel'));

            // --- Overlay ---
            cp.localStorage.removeItem('overlayStatsMode');
            cp.localStorage.setItem('h2hOverlayEnabled', 'yes');
            cp.PlayerStats.syncOverlayButtonsFromStorage();
            assert('Overlay', 'Legacy h2h flag does not enable mode',
                (cp.localStorage.getItem('overlayStatsMode') || '') === '');
            assert('Overlay', 'Legacy h2h flag cleared',
                cp.localStorage.getItem('h2hOverlayEnabled') === null);

            const h2hBtn = cp.document.getElementById('overlayH2HBtn');
            cp.toggleOverlayStats('h2h');
            assert('Overlay', 'H2H toggle on', cp.localStorage.getItem('overlayStatsMode') === 'h2h');
            cp.toggleOverlayStats('h2h');
            await sleep(150);
            const offPayload = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Overlay', 'H2H toggle off', (cp.localStorage.getItem('overlayStatsMode') || '') === '');
            assert('Overlay', 'Payload hidden when off', offPayload.visible === false);
            assert('Overlay', 'No overlay button active after off',
                h2hBtn && !h2hBtn.classList.contains('active'));

            bs = await reloadBSFrame();
            bs.localStorage.removeItem('overlayStatsMode');
            bs.localStorage.removeItem('overlayStatsPayload');
            bs.localStorage.setItem('overlayStatsPayload', JSON.stringify({
                visible: true, mode: 'h2h', p1Name: 'A', p2Name: 'B', p1Games: 1, p2Games: 0
            }));
            bs.restoreOverlayStatsFromStorage();
            await sleep(150);
            assert('Overlay', 'Browser source hides stale payload without mode', overlayHidden(bs));

            bs.localStorage.setItem('overlayStatsMode', 'h2h');
            bs.restoreOverlayStatsFromStorage();
            await sleep(150);
            assert('Overlay', 'Browser source restores with mode + payload', !overlayHidden(bs));
            bs.localStorage.removeItem('overlayStatsMode');
            bs.localStorage.setItem('overlayStatsPayload', JSON.stringify({ visible: false }));
            bs.restoreOverlayStatsFromStorage();

            // Per-mode overlay positions (p1 / p2 / h2h) — bottom-center anchors
            if (typeof bs.setStorageItem === 'function') {
                bs.setStorageItem('elementPosition_overlayStatsPanel_p1',
                    JSON.stringify({ anchor: 'bottom-center', anchorX: 400, anchorY: 500 }));
                bs.setStorageItem('elementPosition_overlayStatsPanel_h2h',
                    JSON.stringify({ anchor: 'bottom-center', anchorX: 700, anchorY: 600 }));
            } else {
                bs.localStorage.setItem('elementPosition_overlayStatsPanel_p1',
                    JSON.stringify({ anchor: 'bottom-center', anchorX: 400, anchorY: 500 }));
                bs.localStorage.setItem('elementPosition_overlayStatsPanel_h2h',
                    JSON.stringify({ anchor: 'bottom-center', anchorX: 700, anchorY: 600 }));
            }
            bs.applyOverlayStats({ visible: true, mode: 'p1', title: 'P1', emptyMessage: 'n/a' });
            await sleep(80);
            const posPanel = bs.document.getElementById('overlayStatsPanel');
            const p1Rect = posPanel && posPanel.getBoundingClientRect();
            const p1Cx = p1Rect ? Math.round(p1Rect.left + p1Rect.width / 2) : null;
            const p1Bottom = p1Rect ? Math.round(p1Rect.top + p1Rect.height) : null;
            assert('Overlay', 'P1 overlay uses p1 bottom-center position',
                posPanel && posPanel.getAttribute('data-overlay-stats-mode') === 'p1' &&
                Math.abs(p1Cx - 400) <= 2 && Math.abs(p1Bottom - 500) <= 2,
                posPanel && (p1Cx + ',' + p1Bottom + ',' + posPanel.getAttribute('data-overlay-stats-mode')));
            bs.applyOverlayStats({ visible: true, mode: 'h2h', title: 'Head to Head', emptyMessage: 'n/a' });
            await sleep(80);
            const h2hRect = posPanel && posPanel.getBoundingClientRect();
            const h2hCx = h2hRect ? Math.round(h2hRect.left + h2hRect.width / 2) : null;
            const h2hBottom = h2hRect ? Math.round(h2hRect.top + h2hRect.height) : null;
            assert('Overlay', 'H2H overlay uses h2h bottom-center position',
                posPanel && posPanel.getAttribute('data-overlay-stats-mode') === 'h2h' &&
                Math.abs(h2hCx - 700) <= 2 && Math.abs(h2hBottom - 600) <= 2,
                posPanel && (h2hCx + ',' + h2hBottom + ',' + posPanel.getAttribute('data-overlay-stats-mode')));
            bs.applyOverlayStats({ visible: false });

            // --- PlayerStats API ---
            const player = await cp.PlayerStats.ensurePlayer(tag + '_P1');
            testPlayerId = player.id;
            assert('PlayerStats API', 'Create player', player && player.name === (tag + '_P1').substring(0, 20));
            const found = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_p1').toLowerCase());
            assert('PlayerStats API', 'Find by normalized name', found && found.id === player.id);
            await cp.PlayerStats.updatePlayerName(player.id, tag + '_Renamed');
            const renamed = await cp.PlayerStats.getPlayer(player.id);
            assert('PlayerStats API', 'Rename player', renamed.name.indexOf('Renamed') !== -1);

            const searchHits = await cp.PlayerStats.searchPlayers(tag, 5);
            assert('PlayerStats API', 'Search players', searchHits.some(function (p) { return p.id === player.id; }),
                searchHits.length + ' hit(s)');

            // Prefix of an existing name must still offer creating a distinct player
            const longPrefixPlayer = await cp.PlayerStats.ensurePlayer(tag + '_BillyX');
            const shortPrefixName = tag + '_Billy';
            const prefixHits = await cp.PlayerStats.searchPlayers(shortPrefixName, 8);
            assert('PlayerStats API', 'Prefix search finds longer name',
                prefixHits.some(function (p) { return p.id === longPrefixPlayer.id; }),
                prefixHits.map(function (p) { return p.name; }).join(','));
            const p1Input = cp.document.getElementById('p1Name');
            const p1List = cp.document.getElementById('p1Autocomplete');
            p1Input.value = shortPrefixName;
            p1Input.dispatchEvent(new Event('input', { bubbles: true }));
            await sleep(250);
            const autoText = (p1List && p1List.innerText) || '';
            assert('PlayerStats API', 'Autocomplete offers Create alongside prefix match',
                autoText.indexOf('Create new player') !== -1 &&
                autoText.indexOf(shortPrefixName) !== -1 &&
                autoText.indexOf(longPrefixPlayer.name) !== -1,
                autoText.replace(/\n/g, ' | '));
            const createItem = p1List && p1List.querySelector('.autocomplete-new');
            if (createItem) {
                createItem.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
            }
            await sleep(200);
            const shortPlayer = await cp.PlayerStats.findPlayerByNormalizedName(shortPrefixName.toLowerCase());
            assert('PlayerStats API', 'Create short name distinct from longer prefix player',
                shortPlayer && shortPlayer.id !== longPrefixPlayer.id,
                shortPlayer && shortPlayer.id);
            assert('PlayerStats API', 'Create binds data-player-id to new short player',
                p1Input.getAttribute('data-player-id') === (shortPlayer && shortPlayer.id),
                p1Input.getAttribute('data-player-id'));
            p1List.classList.add('noShow');
            p1Input.value = '';
            p1Input.removeAttribute('data-player-id');

            const opp = await cp.PlayerStats.ensurePlayer(tag + '_P2');
            testOpponentId = opp.id;
            await cp.PlayerStats.saveMatch({
                player1Id: player.id,
                player2Id: opp.id,
                player1Name: renamed.name,
                player2Name: opp.name,
                gameType: 'game2',
                scoreP1: 5,
                scoreP2: 2,
                status: 'completed',
                date: new Date().toISOString().slice(0, 10),
                ballsP1: 0,
                ballsP2: 0
            });
            const h2h = await cp.PlayerStats.getHeadToHead(player.id, opp.id);
            const gamesTotal = (h2h.gamesWon[player.id] || 0) + (h2h.gamesWon[opp.id] || 0);
            assert('PlayerStats API', 'H2H after manual match', gamesTotal >= 1);

            const exp = await cp.PlayerStats.exportData();
            assert('PlayerStats API', 'Export schemaVersion', exp.schemaVersion >= 1);
            assert('PlayerStats API', 'Export players array', Array.isArray(exp.players));

            // --- Scoring ---
            if (typeof cp.performResetScores === 'function') {
                cp.performResetScores({ endMatch: false });
            } else if (typeof cp.resetScores === 'function') {
                try { cp.resetScores(); } catch (e) { /* confirm dialog blocked in iframe */ }
            }
            cp.document.getElementById('p1Name').value = tag + '_Live1';
            cp.document.getElementById('p2Name').value = tag + '_Live2';
            cp.document.getElementById('p1Name').removeAttribute('data-player-id');
            cp.document.getElementById('p2Name').removeAttribute('data-player-id');
            cp.document.getElementById('raceInfoTxt').value = 'Race to 5';
            cp.postNames();
            await sleep(400);

            const scoreBefore = parseInt(cp.getStorageItem('p1ScoreCtrlPanel') || '0', 10);
            cp.postScore('add', '1');
            await sleep(300);
            const scoreAfter = parseInt(cp.getStorageItem('p1ScoreCtrlPanel') || '0', 10);
            assert('Scoring', 'Rack increment', scoreAfter === scoreBefore + 1, scoreBefore + ' → ' + scoreAfter);

            // End Match must not overwrite a completed match's stored final score (scoreboard is 0-0 before stats run).
            const histP1 = await cp.PlayerStats.ensurePlayer(tag + '_HistA');
            const histP2 = await cp.PlayerStats.ensurePlayer(tag + '_HistB');
            cp.document.getElementById('p1Name').value = histP1.name;
            cp.document.getElementById('p2Name').value = histP2.name;
            cp.document.getElementById('p1Name').setAttribute('data-player-id', histP1.id);
            cp.document.getElementById('p2Name').setAttribute('data-player-id', histP2.id);
            cp.document.getElementById('gameType').value = 'game1';
            await cp.gameType('game1');
            await sleep(150);
            cp.document.getElementById('raceInfoTxt').value = '2';
            cp.setStorageItem('raceInfo', '2');
            cp.postNames();
            await sleep(300);
            cp.performResetScores({ endMatch: false });
            await sleep(200);
            cp.postScore('add', '1');
            await sleep(400);
            const matchesMidMatch = await cp.PlayerStats.getMatchesForPlayer(histP1.id);
            const pendingMidMatch = cp.PlayerStats.getActivePendingMatch();
            assert('Match History', 'Mid-match rack not saved to history',
                pendingMidMatch && pendingMidMatch.racks && pendingMidMatch.racks.length === 1 &&
                !matchesMidMatch.some(function (m) { return m.id === pendingMidMatch.id; }));

            cp.localStorage.setItem('overlayStatsMode', 'p2');
            const p2LoserOverlay = await cp.PlayerStats.buildOverlayStatsPayload();
            assert('Match History', 'P2 overlay shows stats after frame loss',
                p2LoserOverlay && !p2LoserOverlay.emptyMessage && p2LoserOverlay.racksWL,
                p2LoserOverlay && JSON.stringify(p2LoserOverlay));
            assert('Match History', 'P2 overlay racks reflect loss',
                p2LoserOverlay && String(p2LoserOverlay.racksWL).indexOf('0/1') !== -1,
                p2LoserOverlay && String(p2LoserOverlay.racksWL));
            cp.localStorage.removeItem('overlayStatsMode');

            assert('Match History', 'Call Game available mid-race',
                cp.PlayerStats.canCallGame() === true);
            if (typeof cp.updateCallGameButton === 'function') {
                cp.updateCallGameButton();
            }
            const callWrapMid = cp.document.getElementById('callGameWrap');
            assert('Match History', 'Call Game button visible mid-race',
                callWrapMid && !callWrapMid.classList.contains('noShow'));
            if (typeof cp.callGameScores === 'function') {
                cp.callGameScores();
            } else {
                cp.openResetScoresModal('callGame');
            }
            await sleep(100);
            const callModal = cp.document.getElementById('resetScoresModal');
            assert('Match History', 'Call Game opens confirm modal',
                callModal && callModal.style.display === 'block');
            assert('Match History', 'Call Game modal title',
                (cp.document.getElementById('resetScoresModalTitle').textContent || '') === 'Call Match Early');
            cp.cancelResetScores();
            assert('Match History', 'Cancel Call Game leaves pending match',
                cp.PlayerStats.canCallGame() === true &&
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 1);

            // Separate early-end path: Call Game saves 1-0 before race completes.
            const callP1 = await cp.PlayerStats.ensurePlayer(tag + '_CallA');
            const callP2 = await cp.PlayerStats.ensurePlayer(tag + '_CallB');
            cp.document.getElementById('p1Name').value = callP1.name;
            cp.document.getElementById('p2Name').value = callP2.name;
            cp.document.getElementById('p1Name').setAttribute('data-player-id', callP1.id);
            cp.document.getElementById('p2Name').setAttribute('data-player-id', callP2.id);
            cp.document.getElementById('gameType').value = 'game1';
            await cp.gameType('game1');
            await sleep(100);
            cp.document.getElementById('raceInfoTxt').value = '5';
            cp.setStorageItem('raceInfo', '5');
            cp.postNames();
            await sleep(300);
            cp.performResetScores({ endMatch: false });
            await sleep(200);
            cp.postScore('add', '1');
            await sleep(400);
            assert('Match History', 'Call Game can save after one rack', cp.PlayerStats.canCallGame() === true);
            const calledOk = await cp.PlayerStats.callGame();
            assert('Match History', 'Call Game returns saved', calledOk === true);
            cp.performResetScores({ endMatch: true });
            await sleep(300);
            const calledMatches = await cp.PlayerStats.getMatchesForPlayer(callP1.id);
            const calledMatch = calledMatches.find(function (m) {
                return m.status === 'completed' && m.finalScore &&
                    m.finalScore.p1 === 1 && m.finalScore.p2 === 0 &&
                    ((m.player1Id === callP1.id && m.player2Id === callP2.id) ||
                        (m.player1Id === callP2.id && m.player2Id === callP1.id));
            });
            assert('Match History', 'Call Game stores completed match in history',
                !!calledMatch, calledMatches.length);
            assert('Match History', 'Call Game awards game to leader',
                calledMatch && calledMatch.winnerId === callP1.id);
            assert('Match History', 'Call Game clears scoreboard',
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 0);
            assert('Match History', 'Call Game hidden after save',
                cp.PlayerStats.canCallGame() === false);

            // Switching game type mid-match Call-Games / End-Matches / resets under the old type.
            const switchP1 = await cp.PlayerStats.ensurePlayer(tag + '_SwitchA');
            const switchP2 = await cp.PlayerStats.ensurePlayer(tag + '_SwitchB');
            cp.document.getElementById('p1Name').value = switchP1.name;
            cp.document.getElementById('p2Name').value = switchP2.name;
            cp.document.getElementById('p1Name').setAttribute('data-player-id', switchP1.id);
            cp.document.getElementById('p2Name').setAttribute('data-player-id', switchP2.id);
            cp.document.getElementById('gameType').value = 'game1';
            await cp.gameType('game1');
            cp.document.getElementById('raceInfoTxt').value = '5';
            cp.setStorageItem('raceInfo', '5');
            cp.postNames();
            await sleep(300);
            cp.performResetScores({ endMatch: false });
            await sleep(200);
            cp.postScore('add', '1');
            await sleep(400);
            cp.setStorageItem('p1BallsCtrlPanel', '3');
            cp.document.getElementById('p1Balls').value = '3';
            assert('Match History', 'Game-type switch can Call Game mid-race',
                cp.PlayerStats.canCallGame() === true);
            const switchMatchesBefore = (await cp.PlayerStats.getMatchesForPlayer(switchP1.id)).length;
            cp.document.getElementById('gameType').value = 'game8';
            await cp.gameType('game8');
            await sleep(200);
            assert('Match History', 'Game-type switch clears rack score',
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 0);
            assert('Match History', 'Game-type switch clears ball/points score',
                parseInt(cp.getStorageItem('p1BallsCtrlPanel'), 10) === 0);
            assert('Match History', 'Game-type switch applies new type',
                cp.getStorageItem('gameType') === 'game8');
            const switchMatchesAfter = await cp.PlayerStats.getMatchesForPlayer(switchP1.id);
            assert('Match History', 'Game-type switch Call-Games prior match into history',
                switchMatchesAfter.length >= switchMatchesBefore + 1,
                switchMatchesBefore + ' → ' + switchMatchesAfter.length);
            assert('Match History', 'Saved match kept prior game type (8-Ball)',
                switchMatchesAfter.some(function (m) {
                    return m.gameType === 'game1' && m.status === 'completed' &&
                        m.finalScore && m.finalScore.p1 === 1;
                }));

            const callH2H = await cp.PlayerStats.getHeadToHead(callP1.id, callP2.id);
            assert('Match History', 'Call Game logs H2H match win',
                callH2H && (callH2H.gamesWon[callP1.id] || 0) >= 1,
                callH2H && JSON.stringify(callH2H.gamesWon));
            assert('Match History', 'Call Game logs H2H frame/rack win',
                callH2H && (callH2H.racksWon[callP1.id] || 0) >= 1,
                callH2H && JSON.stringify(callH2H.racksWon));
            cp.localStorage.setItem('overlayStatsMode', 'h2h');
            cp.document.getElementById('p1Name').value = callP1.name;
            cp.document.getElementById('p2Name').value = callP2.name;
            cp.document.getElementById('p1Name').setAttribute('data-player-id', callP1.id);
            cp.document.getElementById('p2Name').setAttribute('data-player-id', callP2.id);
            const callH2HOverlay = await cp.PlayerStats.buildOverlayStatsPayload();
            bs.applyOverlayStats(callH2HOverlay);
            await sleep(50);
            const callH2HText = (bs.document.getElementById('overlayStatsBody').innerText || '');
            assert('Match History', 'H2H overlay shows Matches Won',
                callH2HText.indexOf('Matches Won') !== -1, callH2HText.replace(/\n/g, ' | '));
            assert('Match History', 'H2H overlay centers label without colon scoreline',
                callH2HText.indexOf('Matches Won') !== -1 &&
                callH2HText.indexOf('Matches Won ') === -1 &&

                scoreMarginSafe: laggingMargin.safe,
                showPointsRemaining: true,
                pointsRemainingLabel: 'Points Remaining',
                pointsRemaining: laggingMargin.remaining,
                pointsRemainingTone: laggingMargin.pointsRemainingTone
            });
            bs.applyOverlayStats(marginOverlay);
            await sleep(50);
            const dangerCell = bs.document.querySelector('#overlayStatsBody .overlay-stats-danger');
            const marginText = (bs.document.getElementById('overlayStatsBody').innerText || '');
            assert('Snooker', 'Overlay shows Difference and Points Remaining rows',
                marginText.indexOf('Difference') !== -1 &&
                marginText.indexOf('-40') !== -1 &&
                marginText.indexOf('Points Remaining') !== -1 &&
                marginText.indexOf('27') !== -1,
                marginText.replace(/\n/g, ' | '));
            assert('Snooker', 'Lagging overlay Points Remaining is red when no comeback',
                !!dangerCell && (dangerCell.textContent || '').indexOf('27') !== -1,
                dangerCell ? dangerCell.textContent : 'missing danger class');
            assert('Snooker', 'Difference value is not colored',
                !bs.document.querySelector('#overlayStatsBody tr .overlay-stats-danger') ||
                Array.from(bs.document.querySelectorAll('#overlayStatsBody tr')).every(function (tr) {
                    const label = (tr.querySelector('.overlay-stats-col-label') || {}).textContent || '';
                    const danger = tr.querySelector('.overlay-stats-danger');
                    return label.indexOf('Difference') === -1 || !danger;
                }));
            const leadOverlay = Object.assign({}, marginOverlay, {
                scoreMargin: leadingMargin.display,
                scoreMarginCritical: leadingMargin.critical,
                scoreMarginSafe: leadingMargin.safe,
                pointsRemaining: leadingMargin.remaining,
                pointsRemainingTone: leadingMargin.pointsRemainingTone
            });
            bs.applyOverlayStats(leadOverlay);
            await sleep(50);
            const safeCell = bs.document.querySelector('#overlayStatsBody .overlay-stats-safe');
            assert('Snooker', 'Leading overlay Points Remaining is green when opponent cannot come back',
                !!safeCell && (safeCell.textContent || '').indexOf('27') !== -1,
                safeCell ? safeCell.textContent : 'missing safe class');
            cp.setStorageItem('snookerCurrentBreak', '0');
            cp.setSnookerRedsPotted(0);
            cp.setSnookerClearedColors([]);
            cp.setSnookerPhase('red');
            cp.setStorageItem('snookerGoldEnabled', 'no');
            cp.setStorageItem('p1BallsCtrlPanel', '0');
            cp.setStorageItem('p2BallsCtrlPanel', '0');
            assert('Snooker', 'Possible break at frame start is 147',
                cp.getSnookerPossibleBreak('1') === 147,
                String(cp.getSnookerPossibleBreak('1')));
            cp.setSnookerRedsPotted(5);
            cp.setSnookerPhase('color');
            cp.setStorageItem('snookerCurrentBreak', '8');
            cp.setStorageItem('activePlayer', '1');
            // current 8 + pending color 7 + 10 unpotted reds×8 + 27 colors = 8+7+80+27 = 122
            assert('Snooker', 'Possible break accounts for current + remaining',
                cp.getSnookerPossibleBreak('1') === 122,
                String(cp.getSnookerPossibleBreak('1')));
            // Inactive: 10×8 + 27 = 107 (no current break, no owed color)
            assert('Snooker', 'Inactive possible break ignores color phase',
                cp.getSnookerPossibleBreak('2') === 107,
                String(cp.getSnookerPossibleBreak('2')));
            cp.setStorageItem('snookerGoldEnabled', 'yes');
            // 122 - 27 + 47 = 142 (colors package becomes 47 with gold)
            assert('Snooker', 'Possible break adds gold when enabled',
                cp.getSnookerPossibleBreak('1') === 142,
                String(cp.getSnookerPossibleBreak('1')));
            cp.setStorageItem('snookerGoldEnabled', 'no');
            cp.setSnookerRedsPotted(15);
            cp.setSnookerPhase('color');
            cp.setSnookerClearedColors([]);
            // After 15th red: current 8 + color 7 + 27 clearance = 42
            assert('Snooker', 'Possible break after 15th red includes pending color + clearance',
                cp.getSnookerPossibleBreak('1') === 42,
                String(cp.getSnookerPossibleBreak('1')));
            // Incoming player would start clearance on yellow, not an owed color
            assert('Snooker', 'Inactive after 15th red is clearance only (27)',
                cp.getSnookerPossibleBreak('2') === 27,
                String(cp.getSnookerPossibleBreak('2')));

            // Difference / Points Remaining stay hidden until someone scores
            cp.setStorageItem('p1BallsCtrlPanel', '0');
            cp.setStorageItem('p2BallsCtrlPanel', '0');
            assert('Snooker', '0-0 hides Difference / Points Remaining',
                cp.getSnookerScoreMargin('1').showMargin === false);
            // Difference vs Points Remaining on the table
            cp.setSnookerRedsPotted(0);
            cp.setSnookerPhase('red');
            cp.setSnookerClearedColors([]);
            cp.setStorageItem('snookerCurrentBreak', '0');
            cp.setStorageItem('p1BallsCtrlPanel', '40');
            cp.setStorageItem('p2BallsCtrlPanel', '30');
            assert('Snooker', 'Scored frame shows Difference / Points Remaining',
                cp.getSnookerScoreMargin('1').showMargin === true);
            assert('Snooker', 'P1 Difference display is +10',
                cp.getSnookerScoreMargin('1').display === '+10',
                JSON.stringify(cp.getSnookerScoreMargin('1')));
            assert('Snooker', 'P1 Difference is not critical with full table',
                cp.getSnookerScoreMargin('1').critical === false);
            assert('Snooker', 'P2 Difference display is -10',
                cp.getSnookerScoreMargin('2').display === '-10',
                JSON.stringify(cp.getSnookerScoreMargin('2')));
            // Behind by more than remaining: set scores far apart with only colors left
            cp.setSnookerRedsPotted(15);
            cp.setSnookerPhase('red');
            cp.setSnookerClearedColors([]);
            cp.setStorageItem('p1BallsCtrlPanel', '10');
            cp.setStorageItem('p2BallsCtrlPanel', '50');
            // P1 behind by 40, only 27 left → critical
            assert('Snooker', 'Table remaining after reds is 27',
                cp.getSnookerPointsRemainingOnTable() === 27,
                String(cp.getSnookerPointsRemainingOnTable()));
            assert('Snooker', 'P1 behind by more than table is critical',
                cp.getSnookerScoreMargin('1').critical === true &&
                cp.getSnookerScoreMargin('1').pointsRemainingTone === 'danger' &&
                cp.getSnookerScoreMargin('1').display === '-40',
                JSON.stringify(cp.getSnookerScoreMargin('1')));
            assert('Snooker', 'P2 ahead when opponent cannot come back is safe',
                cp.getSnookerScoreMargin('2').safe === true &&
                cp.getSnookerScoreMargin('2').critical === false &&
                cp.getSnookerScoreMargin('2').pointsRemainingTone === 'safe' &&
                cp.getSnookerScoreMargin('2').display === '+40',
                JSON.stringify(cp.getSnookerScoreMargin('2')));
            assert('Snooker', 'Points Remaining matches inactive possible break',
                cp.getSnookerScoreMargin('1').remaining === cp.getSnookerPossibleBreak('2'),
                JSON.stringify({
                    marginLeft: cp.getSnookerScoreMargin('1').remaining,
                    inactivePossible: cp.getSnookerPossibleBreak('2')
                }));

            cp.setSnookerPhase('red');
            cp.setSnookerClearedColors([2, 3, 4, 5, 6, 7]);
            cp.updateSnookerBallAvailability();
            const freeBall = cp.document.getElementById('ball 10');
            const foulBall = cp.document.getElementById('ball 11');
            assert('Snooker', 'Free ball disabled when all colors cleared',
                freeBall && freeBall.classList.contains('snooker-ball-disabled'));
            assert('Snooker', 'Foul ball disabled when all colors cleared',
                foulBall && foulBall.classList.contains('snooker-ball-disabled'));
            cp.setSnookerClearedColors([]);
            cp.setSnookerRedsPotted(15);
            cp.setSnookerPhase('red');
            cp.updateSnookerBallAvailability();
            const yellow = cp.document.getElementById('ball 2');
            const green = cp.document.getElementById('ball 3');
            const black = cp.document.getElementById('ball 7');
            assert('Snooker', 'Clearance enables yellow first',
                yellow && !yellow.classList.contains('snooker-ball-disabled'));
            assert('Snooker', 'Clearance disables green before yellow',
                green && green.classList.contains('snooker-ball-disabled'));
            assert('Snooker', 'Clearance disables black before earlier colors',
                black && black.classList.contains('snooker-ball-disabled'));
            cp.setSnookerClearedColors([2]);
            cp.updateSnookerBallAvailability();
            assert('Snooker', 'Clearance enables green after yellow',
                green && !green.classList.contains('snooker-ball-disabled') &&
                yellow && yellow.classList.contains('snooker-ball-disabled'));
            cp.setSnookerClearedColors([]);
            cp.setSnookerRedsPotted(0);
            cp.setStorageItem('snookerCurrentBreak', '0');
            assert('Snooker', 'Overlay stats are scoped to Snooker game type',
                snookerOverlay.gameType === 'game8');

            cp.setStorageItem('snookerCurrentBreak', '31');
            cp.setStorageItem('snookerRedsPotted', '4');
            cp.setStorageItem('snookerPhase', 'color');
            await cp.gameType('game8', { restore: true });
            assert('Snooker', 'Restore gameType keeps current break',
                cp.getSnookerCurrentBreak() === 31, String(cp.getSnookerCurrentBreak()));
            assert('Snooker', 'Restore gameType keeps reds potted',
                cp.getSnookerRedsPotted() === 4, String(cp.getSnookerRedsPotted()));
            assert('Snooker', 'Restore gameType keeps phase',
                cp.getSnookerPhase() === 'color', String(cp.getSnookerPhase()));
            await cp.gameType('game1');
            await cp.gameType('game8');
            assert('Snooker', 'Switching into Snooker resets current break',
                cp.getSnookerCurrentBreak() === 0, String(cp.getSnookerCurrentBreak()));
            const snookerBall1Src = ((cp.document.getElementById('ball 1') || {}).querySelector('img') || {}).src || '';
            assert('Snooker', 'Snooker mode uses snooker ball art',
                snookerBall1Src.indexOf('snooker') !== -1, snookerBall1Src);
            await cp.gameType('game5');
            const bankBall1Src = ((cp.document.getElementById('ball 1') || {}).querySelector('img') || {}).src || '';
            assert('Snooker', 'Leaving Snooker for Bank restores pool ball art',
                bankBall1Src.indexOf('snooker') === -1 &&
                (bankBall1Src.indexOf('1ball_small') !== -1 || bankBall1Src.indexOf('ball') !== -1),
                bankBall1Src);
            await cp.gameType('game8');
            await cp.gameType('game4');
            const straightBall1Src = ((cp.document.getElementById('ball 1') || {}).querySelector('img') || {}).src || '';
            assert('Snooker', 'Leaving Snooker for Straight restores pool ball art',
                straightBall1Src.indexOf('snooker') === -1, straightBall1Src);
            await cp.gameType('game8');
            await cp.gameType('game6');
            const onePocketBall1Src = ((cp.document.getElementById('ball 1') || {}).querySelector('img') || {}).src || '';
            assert('Snooker', 'Leaving Snooker for One Pocket restores pool ball art',
                onePocketBall1Src.indexOf('snooker') === -1, onePocketBall1Src);
            await cp.gameType('game8');
            cp.setStorageItem('snookerCurrentBreak', '0');

            await sleep(200);
            const bsRace = bs.document.getElementById('raceInfo');
            assert('Snooker', 'Browser source race shows raw Best Of value',
                bsRace && (bsRace.innerHTML || '').indexOf('35') !== -1 &&
                (bsRace.innerHTML || '').indexOf('Best of') === -1,
                bsRace && bsRace.innerHTML);
            if (bs.handlers && bs.handlers.gameType) {
                bs.handlers.gameType({ gameType: 'game8', ballSelection: 'snooker' });
                await sleep(50);
                assert('Snooker', 'Browser source hides ball tracker in snooker',
                    bs.document.getElementById('ballTracker').classList.contains('noShow'));
                // Regression: Ball Tracker can stay on for CP scoring — Display Balls / overlay must still hide
                bs.localStorage.setItem('enableBallTracker', 'yes');
                bs.localStorage.setItem('enableBallDisplay', 'yes');
                if (typeof bs.setOverlayBallTrackerVisible === 'function') {
                    bs.setOverlayBallTrackerVisible(true);
                }
                assert('Snooker', 'Overlay stays hidden when enableBallTracker is yes',
                    bs.document.getElementById('ballTracker').classList.contains('noShow') &&
                    bs.document.getElementById('ballTracker').style.display === 'none');
                assert('Snooker', 'Display Balls control hidden for Snooker',
                    cp.document.getElementById('ballDisplayDiv').classList.contains('noShow'));
                assert('Snooker', 'Ball Tracker can remain enabled for scoring',
                    cp.document.getElementById('ballTrackerCheckbox').checked === true);
                if (typeof bs.applyOverlayBallTrackerLayout === 'function') {
                    bs.applyOverlayBallTrackerLayout();
                }
                assert('Snooker', 'Layout init cannot reveal snooker overlay tracker',
                    bs.document.getElementById('ballTracker').classList.contains('noShow') &&
                    bs.document.getElementById('ballTracker').style.display === 'none');
            }

            // Reset Score (mid-match) clears frames + points via in-page confirm modal
            cp.setStorageItem('p1ScoreCtrlPanel', 2);
            cp.setStorageItem('p2ScoreCtrlPanel', 1);
            cp.document.getElementById('p1Score').value = '2';
            cp.document.getElementById('p2Score').value = '1';
            cp.setStorageItem('p1BallsCtrlPanel', 14);
            cp.setStorageItem('p2BallsCtrlPanel', 9);
            if (p1BallsEl) { p1BallsEl.value = '14'; }
            if (p2BallsEl) { p2BallsEl.value = '9'; }
            cp.updateScoreControlAvailability();
            assert('Snooker', 'Mid-match button is Reset Score before clear',
                resetBtn.textContent.trim() === 'Reset Score');
            cp.resetScores();
            await sleep(50);
            const resetModal = cp.document.getElementById('resetScoresModal');
            assert('Snooker', 'Reset Score opens confirm modal',
                resetModal && cp.getComputedStyle(resetModal).display !== 'none');
            assert('Snooker', 'Reset modal title',
                (cp.document.getElementById('resetScoresModalTitle').textContent || '') === 'Reset Score');
            cp.cancelResetScores();
            await sleep(50);
            assert('Snooker', 'Cancel leaves scores unchanged',
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 2);
            cp.resetScores();
            await sleep(50);
            cp.confirmResetScores();
            await sleep(300);
            assert('Snooker', 'Reset Score clears frames',
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 0 &&
                parseInt(cp.getStorageItem('p2ScoreCtrlPanel'), 10) === 0);
            assert('Snooker', 'Reset Score clears points',
                parseInt(cp.getStorageItem('p1BallsCtrlPanel'), 10) === 0 &&
                parseInt(cp.getStorageItem('p2BallsCtrlPanel'), 10) === 0);
            assert('Snooker', 'Reset Score button stays danger',
                resetBtn.classList.contains('danger-btn'));

            // Restore gold; leave panel on 8-Ball
            cp.setStorageItem('snookerGoldEnabled', prevSnookerGold);
            if (goldCheckbox) {
                goldCheckbox.checked = prevSnookerGold === 'yes';
            }
            cp.document.getElementById('gameType').value = 'game1';
            await cp.gameType('game1');
            await sleep(150);
            cp.document.getElementById('raceInfoTxt').value = '5';
            cp.setStorageItem('raceInfo', '5');
            cp.setStorageItem('p1ScoreCtrlPanel', 0);
            cp.setStorageItem('p2ScoreCtrlPanel', 0);
            cp.document.getElementById('p1Score').value = '0';
            cp.document.getElementById('p2Score').value = '0';
            cp.updateScoreControlAvailability();
            const resetAfter = cp.document.getElementById('resetScores');
            assert('Snooker', 'Non-snooker mid-race is Reset Score',
                resetAfter && resetAfter.textContent.trim() === 'Reset Score',
                resetAfter && resetAfter.textContent);
            assert('Snooker', 'Non-snooker Reset Score is danger',
                resetAfter && resetAfter.classList.contains('danger-btn'));

            cp.document.getElementById('p1Score').value = '5';
            cp.setStorageItem('p1ScoreCtrlPanel', 5);
            cp.updateScoreControlAvailability();
            assert('Snooker', 'Race complete becomes End Match',
                resetAfter.textContent.trim() === 'End Match', resetAfter.textContent);
            assert('Snooker', 'Race complete End Match is danger',
                resetAfter.classList.contains('danger-btn'));
            assert('Snooker', 'Pool balls disabled when race complete',
                cp.isGameScoringLocked() === true &&
                cp.document.getElementById('ball 1').classList.contains('snooker-ball-disabled'));
            const poolBall = cp.document.getElementById('ball 1');
            cp.togglePot(poolBall);
            await sleep(50);
            assert('Snooker', 'Locked pool ball click has no effect',
                !poolBall.classList.contains('faded'));
            cp.setStorageItem('p1BallsCtrlPanel', 0);
            cp.postBalls('add', '1');
            assert('Snooker', 'Locked ball +/- has no effect',
                parseInt(cp.getStorageItem('p1BallsCtrlPanel'), 10) === 0);

            cp.resetScores();
            await sleep(50);
            assert('Snooker', 'End Match opens confirm modal',
                resetModal && cp.getComputedStyle(resetModal).display !== 'none');
            assert('Snooker', 'End Match modal title',
                (cp.document.getElementById('resetScoresModalTitle').textContent || '') === 'End Match');
            cp.cancelResetScores();
            await sleep(50);
            assert('Snooker', 'Cancel End Match leaves scores',
                parseInt(cp.getStorageItem('p1ScoreCtrlPanel'), 10) === 5);
            const ball8After = cp.document.getElementById('ball 8');
            assert('Snooker', '8-ball restored on pool tracker after leaving snooker',
                ball8After && !ball8After.classList.contains('noShow'));

            if (prevGameType !== 'game1') {
                cp.document.getElementById('gameType').value = prevGameType;
                await cp.gameType(prevGameType);
                await sleep(100);
            }

            cp.localStorage.removeItem('overlayStatsMode');
            cp.localStorage.removeItem('overlayStatsPayload');
            bs.applyOverlayStats({ visible: false });

            try { await cp.PlayerStats.deletePlayer(bankPlayer.id); } catch (e) { /* ignore */ }
            try { await cp.PlayerStats.deletePlayer(bankOpp.id); } catch (e) { /* ignore */ }
            try { await cp.PlayerStats.deletePlayer(snP1.id); } catch (e) { /* ignore */ }
            try { await cp.PlayerStats.deletePlayer(snP2.id); } catch (e) { /* ignore */ }

        } catch (err) {
            assert('Runner', 'Test harness', false, err.message || String(err));
        } finally {
            if (cp && testPlayerId) {
                try { await cp.PlayerStats.deletePlayer(testPlayerId); } catch (e) { /* ignore */ }
            }
            if (cp && testOpponentId) {
                try { await cp.PlayerStats.deletePlayer(testOpponentId); } catch (e) { /* ignore */ }
            }
            if (cp) {
                try {
                    const live1 = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_live1').toLowerCase());
                    const live2 = await cp.PlayerStats.findPlayerByNormalizedName((tag + '_live2').toLowerCase());
                    if (live1) { await cp.PlayerStats.deletePlayer(live1.id); }
                    if (live2) { await cp.PlayerStats.deletePlayer(live2.id); }
                } catch (e) { /* ignore */ }
            }
        }

        renderResults(rows);
        statusEl.textContent = 'Done.';
        runBtn.disabled = false;
        reloadBtn.disabled = false;
    }

    window.runAllTests = runAllTests;

    runBtn.addEventListener('click', function () {
        runAllTests().catch(function (err) {
            summaryEl.className = 'fail';
            summaryEl.textContent = 'Runner error: ' + err.message;
            runBtn.disabled = false;
            reloadBtn.disabled = false;
        });
    });

    reloadBtn.addEventListener('click', function () {
        reloadFrames().catch(function (err) {
            statusEl.textContent = 'Reload failed: ' + err.message;
        });
    });

    reloadFrames().then(function () {
        statusEl.textContent = 'Frames ready — click Run all tests.';
    }).catch(function (err) {
        statusEl.textContent = 'Frame load failed: ' + err.message;
    });
    </script>
</body>
</html>
